    - main [ref=e3006]:
      - heading "Teil 11 – Langfristige Vision, Lebensmodell und Schlussbetrachtung" [level=1] [ref=e3007]
      - heading "Warum dieses Projekt entsteht" [level=2] [ref=e3008]
      - paragraph [ref=e3009]: Dieses Projekt entstand nicht aus dem Wunsch, auszusteigen.
      - paragraph [ref=e3010]: Es entstand aus dem Wunsch, anders aufzubauen.
      - paragraph [ref=e3011]: Nicht schneller.
      - paragraph [ref=e3012]: Nicht größer.
      - paragraph [ref=e3013]: Sondern näher an dem, was für die Gründer langfristig ein gutes Leben bedeutet.
      - paragraph [ref=e3014]: Der Hof soll kein Objekt werden.
      - paragraph [ref=e3015]: Er soll ein Ort werden.
      - paragraph [ref=e3016]: Ein Ort, an dem Leben, Arbeit, Begegnung und Entwicklung zusammenfinden dürfen.
      - heading "Das langfristige Lebensmodell" [level=2] [ref=e3017]
      - paragraph [ref=e3018]: Das Ziel ist nicht, möglichst viele Gebäude zu errichten.
      - paragraph [ref=e3019]: Das Ziel ist nicht, möglichst viele Gäste zu gewinnen.
      - paragraph [ref=e3020]: Und auch nicht, einen maximalen wirtschaftlichen Ertrag zu erzeugen.
      - paragraph [ref=e3021]: "Das langfristige Ziel ist:"
      - paragraph [ref=e3022]: Ein Leben zu schaffen, das tragfähig ist.
      - paragraph [ref=e3023]: "Ein Alltag, der:"
      - paragraph [ref=e3024]: • wirtschaftlich funktioniert
      - paragraph [ref=e3025]: • Freude macht
      - paragraph [ref=e3026]: • Freiheit zulässt
      - paragraph [ref=e3027]: • Gemeinschaft ermöglicht
      - paragraph [ref=e3028]: • Entwicklung offen hält
      - paragraph [ref=e3029]: Der Hof soll deshalb nicht nur Einkommen erzeugen.
      - paragraph [ref=e3030]: Er soll Lebensqualität erzeugen.
      - heading "Die Rolle der Arbeit" [level=2] [ref=e3031]
      - paragraph [ref=e3032]: Arbeit wird in diesem Projekt nicht als Gegensatz zum Leben verstanden.
