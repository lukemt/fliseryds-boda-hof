      - paragraph [ref=e3048]: • Begegnung
      - paragraph [ref=e3049]: • Kultur
      - paragraph [ref=e3050]: • Naturerleben
      - paragraph [ref=e3051]: Nicht als getrennte Bereiche.
      - paragraph [ref=e3052]: Sondern als zusammenhängender Alltag.
